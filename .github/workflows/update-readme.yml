name: Update README

on:
  push:
    branches: [main]
    paths: ['Formula/*.rb', 'Casks/*.rb']

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate README
        run: |
          cat > README.md << 'HEADER'
          # Homebrew Tap

          Homebrew formulae for tools by [Helge Sverre](https://github.com/HelgeSverre).

          ## Install

          ```bash
          brew tap helgesverre/tap
          ```

          ## Available Formulae

          | Formula | Description | Install |
          |---------|-------------|---------|
          HEADER

          for f in Formula/*.rb; do
            name=$(basename "$f" .rb)
            desc=$(grep '^ *desc ' "$f" | head -1 | sed 's/^ *desc "\(.*\)"/\1/')
            homepage=$(grep '^ *homepage ' "$f" | head -1 | sed 's/^ *homepage "\(.*\)"/\1/')
            if [ -n "$homepage" ]; then
              echo "| [$name]($homepage) | $desc | \`brew install helgesverre/tap/$name\` |" >> README.md
            else
              echo "| $name | $desc | \`brew install helgesverre/tap/$name\` |" >> README.md
            fi
          done

          if ls Casks/*.rb >/dev/null 2>&1; then
            cat >> README.md << 'CASKS'

          ## Available Casks

          | Cask | Description | Install |
          |------|-------------|---------|
          CASKS
            for f in Casks/*.rb; do
              name=$(basename "$f" .rb)
              desc=$(grep '^ *desc ' "$f" | head -1 | sed 's/^ *desc "\(.*\)"/\1/')
              homepage=$(grep '^ *homepage ' "$f" | head -1 | sed 's/^ *homepage "\(.*\)"/\1/')
              if [ -n "$homepage" ]; then
                echo "| [$name]($homepage) | $desc | \`brew install --cask helgesverre/tap/$name\` |" >> README.md
              else
                echo "| $name | $desc | \`brew install --cask helgesverre/tap/$name\` |" >> README.md
              fi
            done
          fi

          cat >> README.md << 'FOOTER'

          ## Usage

          ```bash
          # Install a formula
          brew install helgesverre/tap/<formula-name>

          # Install an app (cask)
          brew install --cask helgesverre/tap/<cask-name>

          # Update to latest version
          brew update && brew upgrade helgesverre/tap/<formula-name>
          ```

          ## How It Works

          Formulae and casks are published automatically by each project's release workflow (most via [cargo-dist](https://github.com/axodotdev/cargo-dist)) when a new version is tagged in the source repository. No manual updates needed.
          FOOTER

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: auto-update README with current formulae"
          git push
